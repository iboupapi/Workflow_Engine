# ==============================================================================
# BROUILLON — CIRCUIT E-SERVICE (Demandes citoyennes). Hypothèses signalées
# ci-dessous, à valider avec le métier (§14 du cahier de recette).
# La cible RESPONSABLE_TRAITEMENT est supportée par le moteur : elle renvoie à
# l'étape de traitement mémorisée par la transition marquée « setsHandler: true »
# (exigence MOT-06 : marqueur porté par la TRANSITION de traitement).
# Règle métier (rapport d'étude) : le rejet revient à la personne responsable du
# traitement INITIAL — l'agent traitant si la demande lui a été imputée, le chef de
# division s'il a traité lui-même. Le circuit sépare donc, à la sortie du chef, le
# traitement direct (VALIDER, marqué) et la validation après délégation
# (TRANSMETTRE, NON marquée) : sans cette séparation, la validation du chef
# écraserait le marqueur de l'agent et tout rejet reviendrait au chef à tort.
# ==============================================================================
definition:
  key: "E_SERVICE_DEMANDE"
  name: "Circuit des demandes E-Service (brouillon)"
  version: 1

settings:
  # Reprise PROVISOIRE : le rapport ne tranche pas la reprise après correction.
  # FROM_START fait reprendre le circuit depuis le début (voir docs/yaml-format-schema.md).
  resumeStrategyDefault: "FROM_START"

entryPoints:
  - role: "CITOYEN"
    startStepKey: "DEPOT_CITOYEN"

# Bloc obligatoire mais vide : aucune condition SpEL dans ce fichier, donc aucune
# clé n'est autorisée en condition (toute condition serait refusée à l'import).
variables: []

steps:
  # owners : rôles responsables de l'étape (boîte de réception + droit d'agir /start,
  # /transition). Le rôle réservé ADMIN y est interdit. Rôles à confirmer avec le métier.
  - key: "DEPOT_CITOYEN"
    name: "Dépôt citoyen"
    type: "START"
    owners:
      - "CITOYEN"

  - key: "CHEF_DIVISION"
    name: "Chef de division"
    type: "TASK"
    owners:
      - "CHEF_DIVISION"

  - key: "AGENT_TRAITEMENT"
    name: "Agent traitant"
    type: "TASK"
    owners:
      - "AGENT_TRAITEMENT"

  - key: "DLEC"
    name: "Direction DLEC (ne pas expanser : le rapport dit seulement « Direction DLEC »)"
    type: "TASK"
    owners:
      - "DLEC"

  - key: "DGFP"
    name: "Direction de la Fonction Publique"
    type: "TASK"
    owners:
      - "DGFP"

  - key: "SG"
    name: "Secrétariat général"
    type: "TASK"
    owners:
      - "SG"

  - key: "DEMANDE_TRAITEE"
    name: "Demande traitée"
    type: "END"

transitions:
  - source: "DEPOT_CITOYEN"
    action: "SOUMETTRE"
    target: "CHEF_DIVISION"

  # Imputation = action générique : l'historique garde qui a imputé à qui via actorId ;
  # l'attribution formelle (assignee) et le responsable du traitement relèvent
  # d'un chantier moteur dédié (cf. schéma, §5/§13.4 du cahier de recette).
  - source: "CHEF_DIVISION"
    action: "IMPUTER"
    target: "AGENT_TRAITEMENT"

  - source: "AGENT_TRAITEMENT"
    action: "TRANSMETTRE"
    target: "CHEF_DIVISION"
    setsHandler: true

  # Traitement direct : le chef traite lui-même. C'est LUI le responsable du traitement,
  # d'où le marqueur : un rejet de la DLEC/DGFP lui revient.
  - source: "CHEF_DIVISION"
    action: "VALIDER"
    target: "DLEC"
    setsHandler: true

  # Validation après délégation : le dossier porte déjà le marqueur de l'agent
  # (AGENT_TRAITEMENT -TRANSMETTRE-> CHEF_DIVISION). Le chef ne fait que le transmettre,
  # donc AUCUN marqueur ici — sinon il écraserait l'agent et le rejet reviendrait au chef.
  - source: "CHEF_DIVISION"
    action: "TRANSMETTRE"
    target: "DLEC"

  - source: "DLEC"
    action: "VALIDER"
    target: "DGFP"

  - source: "DGFP"
    action: "VALIDER"
    target: "SG"

  - source: "SG"
    action: "VALIDER"
    target: "DEMANDE_TRAITEE"

  # Rejets : le rapport impose le retour au responsable du traitement, cible désormais
  # supportée par le moteur (renvoi vers l'étape mémorisée par la transition marquée
  # « setsHandler: true »). Le rejet du chef de division à la réception garde la cible
  # INITIATEUR (le citoyen), si le ministère confirme ce renvoi.
  - source: "CHEF_DIVISION"
    action: "REJETER"
    target: "INITIATEUR"

  - source: "AGENT_TRAITEMENT"
    action: "REJETER"
    target: "CHEF_DIVISION"

  - source: "DLEC"
    action: "REJETER"
    target: "RESPONSABLE_TRAITEMENT"

  - source: "DGFP"
    action: "REJETER"
    target: "RESPONSABLE_TRAITEMENT"
