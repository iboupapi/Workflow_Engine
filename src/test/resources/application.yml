# Configuration de test : active le profil `migrate` pour que le schéma soit
# migré (compte propriétaire) avant la validation Hibernate (compte applicatif).
# Variables requises : SPRING_DATASOURCE_PASSWORD (app), FLYWAY_OWNER_PASSWORD (owner).
spring:
  profiles:
    active: migrate
  application:
    name: workflow-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_db}
    username: ${SPRING_DATASOURCE_USERNAME:workflow_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    user: ${FLYWAY_OWNER_USER:workflow_owner}
    password: ${FLYWAY_OWNER_PASSWORD:}

# Aligne le socle de test sur le defaut de production : la documentation API est
# desactivee sauf activation explicite (SWAGGER_ENABLED=true). Preuve : Phase0GuardsTest
# (desactivee par defaut) et SwaggerEnabledWhenRequestedTest (activee sur demande).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

auth:
  admin:
    subjects: ${ADMIN_SUBJECTS:}
  jwt:
    issuers: {}
